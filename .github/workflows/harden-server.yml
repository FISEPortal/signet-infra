name: Harden Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "HARDEN" to confirm server hardening'
        required: true
        type: string
      components:
        description: 'Components to harden'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - ssh
          - firewall
          - auto-updates
          - docker
          - login-alerts

jobs:
  harden:
    name: Harden deployment server
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'HARDEN' }}
        run: |
          echo "❌ Confirmation required. Please type 'HARDEN' to proceed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run hardening on deployment host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            TEMP_DIR=$(mktemp -d)
            trap "rm -rf $TEMP_DIR" EXIT
            
            mkdir -p "$TEMP_DIR/scripts"
            
            # Write harden-ssh.sh
            cat << 'SSH_EOF' > "$TEMP_DIR/scripts/harden-ssh.sh"
            #!/bin/bash
            set -e
            
            if [[ $EUID -ne 0 ]]; then
               echo "This script must be run as root"
               exit 1
            fi
            
            SSHD_CONFIG="/etc/ssh/sshd_config"
            BACKUP_CONFIG="/etc/ssh/sshd_config.backup.$(date +%Y%m%d_%H%M%S)"
            
            echo "=== SSH Hardening ==="
            cp "$SSHD_CONFIG" "$BACKUP_CONFIG"
            echo "  ✓ Backup created"
            
            set_ssh_option() {
                local option="$1"
                local value="$2"
                if grep -qE "^#?\s*${option}\s+" "$SSHD_CONFIG"; then
                    sed -i "s/^#*\s*${option}\s.*/${option} ${value}/" "$SSHD_CONFIG"
                else
                    echo "${option} ${value}" >> "$SSHD_CONFIG"
                fi
                echo "  ✓ ${option} ${value}"
            }
            
            set_ssh_option "PasswordAuthentication" "no"
            set_ssh_option "PermitRootLogin" "no"
            set_ssh_option "PermitEmptyPasswords" "no"
            set_ssh_option "X11Forwarding" "no"
            set_ssh_option "AllowAgentForwarding" "no"
            set_ssh_option "AllowTcpForwarding" "no"
            set_ssh_option "MaxAuthTries" "3"
            set_ssh_option "ClientAliveInterval" "300"
            set_ssh_option "ClientAliveCountMax" "0"
            set_ssh_option "Protocol" "2"
            
            if id "fiser" &>/dev/null; then
                set_ssh_option "AllowUsers" "fiser"
            fi
            
            sshd -t && systemctl restart sshd || systemctl restart ssh
            echo "✅ SSH hardening complete!"
            SSH_EOF
            
            # Write setup-firewall.sh
            cat << 'FIREWALL_EOF' > "$TEMP_DIR/scripts/setup-firewall.sh"
            #!/bin/bash
            set -e
            
            if [[ $EUID -ne 0 ]]; then
               echo "This script must be run as root"
               exit 1
            fi
            
            echo "=== Firewall & Fail2ban Setup ==="
            
            apt-get update -qq
            apt-get install -y -qq ufw fail2ban
            
            ufw --force reset >/dev/null
            ufw default deny incoming >/dev/null
            ufw default allow outgoing >/dev/null
            ufw limit ssh >/dev/null
            ufw allow 80/tcp >/dev/null
            ufw allow 443/tcp >/dev/null
            ufw --force enable >/dev/null
            
            cat > /etc/fail2ban/jail.local << 'F2B'
            [DEFAULT]
            bantime = 3600
            findtime = 600
            maxretry = 5
            banaction = ufw
            
            [sshd]
            enabled = true
            port = ssh
            filter = sshd
            logpath = /var/log/auth.log
            maxretry = 3
            F2B
            
            systemctl enable fail2ban >/dev/null 2>&1
            systemctl restart fail2ban
            
            echo "✅ Firewall and Fail2ban setup complete!"
            FIREWALL_EOF
            
            # Write setup-auto-updates.sh
            cat << 'UPDATES_EOF' > "$TEMP_DIR/scripts/setup-auto-updates.sh"
            #!/bin/bash
            set -e
            
            if [[ $EUID -ne 0 ]]; then
               echo "This script must be run as root"
               exit 1
            fi
            
            echo "=== Automatic Security Updates Setup ==="
            
            apt-get update -qq
            apt-get install -y -qq unattended-upgrades apt-listchanges
            
            cat > /etc/apt/apt.conf.d/50unattended-upgrades << 'UU'
            Unattended-Upgrade::Allowed-Origins {
                "${distro_id}:${distro_codename}";
                "${distro_id}:${distro_codename}-security";
            };
            Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
            Unattended-Upgrade::Remove-Unused-Dependencies "true";
            Unattended-Upgrade::Automatic-Reboot "true";
            Unattended-Upgrade::Automatic-Reboot-Time "03:00";
            Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
            UU
            
            cat > /etc/apt/apt.conf.d/20auto-upgrades << 'AU'
            APT::Periodic::Update-Package-Lists "1";
            APT::Periodic::Download-Upgradeable-Packages "1";
            APT::Periodic::AutocleanInterval "7";
            APT::Periodic::Unattended-Upgrade "1";
            AU
            
            systemctl enable unattended-upgrades >/dev/null 2>&1
            systemctl start unattended-upgrades
            
            echo "✅ Automatic updates configured!"
            UPDATES_EOF
            
            # Write harden-docker.sh
            cat << 'DOCKER_EOF' > "$TEMP_DIR/scripts/harden-docker.sh"
            #!/bin/bash
            set -e
            
            if [[ $EUID -ne 0 ]]; then
               echo "This script must be run as root"
               exit 1
            fi
            
            echo "=== Docker Security Hardening ==="
            
            if ! command -v docker &>/dev/null; then
                echo "Docker not installed, skipping"
                exit 0
            fi
            
            mkdir -p /etc/docker
            
            cat > /etc/docker/daemon.json << 'DJ'
            {
                "log-driver": "json-file",
                "log-opts": { "max-size": "10m", "max-file": "3" },
                "live-restore": true,
                "userland-proxy": false,
                "no-new-privileges": true,
                "icc": false
            }
            DJ
            
            systemctl restart docker
            echo "✅ Docker hardening complete!"
            DOCKER_EOF
            
            # Write setup-login-alerts.sh
            cat << 'ALERTS_EOF' > "$TEMP_DIR/scripts/setup-login-alerts.sh"
            #!/bin/bash
            set -e
            
            if [[ $EUID -ne 0 ]]; then
               echo "This script must be run as root"
               exit 1
            fi
            
            echo "=== SSH Login Alerts Setup ==="
            
            cat > /usr/local/bin/ssh-login-alert.sh << 'ALERT'
            #!/bin/bash
            LOGIN_USER="${PAM_USER:-$USER}"
            LOGIN_IP="${PAM_RHOST:-unknown}"
            LOGIN_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')"
            HOSTNAME="$(hostname -f 2>/dev/null || hostname)"
            
            if [[ "${PAM_TYPE:-}" != "open_session" ]] && [[ -z "${SSH_CONNECTION:-}" ]]; then
                exit 0
            fi
            
            MESSAGE="SSH Login: $LOGIN_USER@$HOSTNAME from $LOGIN_IP at $LOGIN_TIME"
            
            source /etc/ssh-login-alerts.conf 2>/dev/null || true
            
            if [[ -n "${SLACK_WEBHOOK:-}" ]]; then
                curl -s -X POST -H 'Content-type: application/json' \
                    --data "{\"text\": \"$MESSAGE\"}" "$SLACK_WEBHOOK" >/dev/null 2>&1 &
            fi
            
            logger -t ssh-login-alert "$MESSAGE"
            exit 0
            ALERT
            
            chmod +x /usr/local/bin/ssh-login-alert.sh
            
            cat > /etc/ssh-login-alerts.conf << 'CONF'
            # SLACK_WEBHOOK="https://hooks.slack.com/services/XXX/YYY/ZZZ"
            CONF
            chmod 600 /etc/ssh-login-alerts.conf
            
            if ! grep -q "ssh-login-alert" /etc/pam.d/sshd 2>/dev/null; then
                echo "session optional pam_exec.so seteuid /usr/local/bin/ssh-login-alert.sh" >> /etc/pam.d/sshd
            fi
            
            echo "✅ Login alerts configured!"
            ALERTS_EOF
            
            chmod +x "$TEMP_DIR/scripts/"*.sh
            
            COMPONENT="${{ github.event.inputs.components }}"
            
            case "$COMPONENT" in
                all)
                    sudo "$TEMP_DIR/scripts/harden-ssh.sh"
                    sudo "$TEMP_DIR/scripts/setup-firewall.sh"
                    sudo "$TEMP_DIR/scripts/setup-auto-updates.sh"
                    sudo "$TEMP_DIR/scripts/harden-docker.sh"
                    sudo "$TEMP_DIR/scripts/setup-login-alerts.sh"
                    ;;
                ssh)
                    sudo "$TEMP_DIR/scripts/harden-ssh.sh"
                    ;;
                firewall)
                    sudo "$TEMP_DIR/scripts/setup-firewall.sh"
                    ;;
                auto-updates)
                    sudo "$TEMP_DIR/scripts/setup-auto-updates.sh"
                    ;;
                docker)
                    sudo "$TEMP_DIR/scripts/harden-docker.sh"
                    ;;
                login-alerts)
                    sudo "$TEMP_DIR/scripts/setup-login-alerts.sh"
                    ;;
            esac
            
            echo ""
            echo "✅ Server hardening complete!"

