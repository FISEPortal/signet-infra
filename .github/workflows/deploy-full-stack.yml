name: Deploy Full Stack

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY-ALL" to confirm full stack deployment'
        required: true
        type: string
      services:
        description: 'Services to deploy'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - infra-only
          - signet
          - marketplace
          - trustvault

jobs:
  deploy:
    name: Deploy Signet ecosystem
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'DEPLOY-ALL' }}
        run: |
          echo "❌ Confirmation required. Please type 'DEPLOY-ALL' to proceed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SIGNET_DEPLOY_HOST }}
          username: ${{ secrets.SIGNET_DEPLOY_USER }}
          key: ${{ secrets.SIGNET_DEPLOY_KEY }}
          source: "scripts/*"
          target: "/tmp/deploy-scripts"
          strip_components: 0

      - name: Deploy services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SIGNET_DEPLOY_HOST }}
          username: ${{ secrets.SIGNET_DEPLOY_USER }}
          key: ${{ secrets.SIGNET_DEPLOY_KEY }}
          script_stop: true
          envs: SERVICES
          script: |
            export SERVICES="${{ github.event.inputs.services }}"
            export GITHUB_ORG="kevinhartig"
            cd /tmp/deploy-scripts/scripts
            chmod +x *.sh
            sudo mkdir -p /opt /app/logs/nginx /var/www/certbot
            
            if [ "$SERVICES" = "all" ] || [ "$SERVICES" = "infra-only" ]; then
              sudo ./deploy-infra.sh
            fi
            
            if [ "$SERVICES" = "all" ] || [ "$SERVICES" = "signet" ]; then
              sudo ./deploy-service.sh signet signet
            fi
            
            if [ "$SERVICES" = "all" ] || [ "$SERVICES" = "marketplace" ]; then
              sudo ./deploy-service.sh marketplace-app marketplace-app
            fi
            
            if [ "$SERVICES" = "all" ] || [ "$SERVICES" = "trustvault" ]; then
              sudo ./deploy-service.sh trustvault-api trustvault-api
            fi
            
            rm -rf /tmp/deploy-scripts
            echo ""
            echo "Deployment complete!"
            docker ps --format "table {{.Names}}\t{{.Status}}" | head -10

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SIGNET_DEPLOY_HOST }}
          username: ${{ secrets.SIGNET_DEPLOY_USER }}
          key: ${{ secrets.SIGNET_DEPLOY_KEY }}
          script: |
            echo "Container status:"
            docker ps | grep -E "(signet|marketplace|trustvault|nginx)" || echo "  No containers found"
            echo ""
            echo "Network:"
            docker network inspect signet-network -f "Containers: {{ len .Containers }}" 2>/dev/null || echo "  Network not found"
            echo ""
            echo "Health check:"
            curl -sk https://localhost/health 2>/dev/null && echo " OK" || echo "  nginx: not responding"


