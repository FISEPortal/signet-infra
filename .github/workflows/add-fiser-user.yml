name: Add Fiser User

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm user creation'
        required: true
        type: string

jobs:
  add-user:
    name: Add fiser user to deployment host
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "❌ Confirmation required. Please type 'yes' to proceed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy scripts to deployment host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "add-fiser-user.sh,lockdown-root.sh,scripts/*"
          target: "/tmp/fiser-setup"
          strip_components: 0

      - name: Execute add-fiser-user script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            cd /tmp/fiser-setup
            chmod +x add-fiser-user.sh lockdown-root.sh
            chmod +x scripts/*.sh 2>/dev/null || true
            sudo ./add-fiser-user.sh
            
            # Cleanup
            rm -rf /tmp/fiser-setup

      - name: Verify fiser user SSH access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: fiser
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            echo "╔════════════════════════════════════════════════════════════╗"
            echo "║           FISER USER SSH VERIFICATION                      ║"
            echo "╚════════════════════════════════════════════════════════════╝"
            echo ""
            echo "✅ SSH login successful!"
            echo ""
            echo "User details:"
            echo "  - Username: $(whoami)"
            echo "  - Home: $HOME"
            echo "  - Shell: $SHELL"
            echo "  - Groups: $(groups)"
            echo ""
            
            # Verify sudo access (should be passwordless)
            echo "Checking sudo access..."
            if sudo -n true 2>/dev/null; then
                echo "  ✅ Sudo access: working (passwordless)"
            else
                echo "  ❌ Sudo access: FAILED - passwordless sudo not working"
                exit 1
            fi
            
            # Verify docker access
            echo ""
            echo "Checking Docker access..."
            if docker info >/dev/null 2>&1; then
                echo "  ✅ Docker access: working"
            else
                echo "  ⚠️  Docker access: may require re-login for group to take effect"
            fi
            
            # Check for lockdown script
            echo ""
            echo "Checking lockdown script..."
            if [[ -x ~/lockdown-root.sh ]]; then
                echo "  ✅ Lockdown script: present at ~/lockdown-root.sh"
            else
                echo "  ❌ Lockdown script: not found"
            fi
            
            # Check for hardening scripts
            echo ""
            echo "Checking hardening scripts..."
            if [[ -d ~/scripts ]] && [[ -x ~/scripts/harden-all.sh ]]; then
                echo "  ✅ Hardening scripts: present at ~/scripts/"
            else
                echo "  ⚠️  Hardening scripts: not found"
            fi
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "🎉 Fiser user is ready!"
            echo ""
            echo "Next steps:"
            echo "  1. Harden server: sudo ~/scripts/harden-all.sh"
            echo "  2. Lock down root: sudo ~/lockdown-root.sh"
            echo ""
