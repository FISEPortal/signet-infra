# =============================================================================
# Signet Infrastructure - Unified Nginx Reverse Proxy Configuration
# =============================================================================
# Routes traffic to all Signet ecosystem applications:
#   /            -> signet-app:3000       (Main Signet application)
#   /marketplace -> marketplace-app:3001  (DApp Marketplace)
#   /storage     -> trustVault-api:3002  (Decentralized storage/assets)
#   metrics.signetapp.xyz -> signet-metrics:3003 (admin panel, FISEPortal/signet-metrics)
#
# Features:
#   - SSL/TLS termination (TLS 1.2/1.3)
#   - HTTP to HTTPS redirect
#   - WebSocket support
#   - Gzip compression
#   - Rate limiting per service
#   - Security headers
#   - Static asset caching
#   - Let's Encrypt ACME support
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Logging format with timing information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance Settings
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=signet_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=marketplace_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=trustvault_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=metrics_auth:10m rate=2r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limit status code
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # Upstream Definitions
    # -------------------------------------------------------------------------
    upstream signet {
        server signet-app:3000;
    }

    upstream marketplace {
        server marketplace-app:3001;
    }

    upstream trustvault {
        server trustvault-api:3002;
    }

    # -------------------------------------------------------------------------
    # HTTP Server - Redirect to HTTPS & ACME Challenge
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name signetapp.xyz www.signetapp.xyz metrics.signetapp.xyz;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Health check endpoint (no redirect)
        location = /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Server - Main Configuration
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name signetapp.xyz www.signetapp.xyz;

        # ---------------------------------------------------------------------
        # SSL Configuration
        # ---------------------------------------------------------------------
        ssl_certificate /etc/letsencrypt/live/signetapp.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/signetapp.xyz/privkey.pem;

        # Modern TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ---------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Connection limits
        limit_conn conn_limit 100;

        # ---------------------------------------------------------------------
        # Proxy Defaults
        # ---------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # =====================================================================
        # TRUSTVAULT API ROUTES (/storage)
        # =====================================================================
        location /storage/ {
            limit_req zone=trustvault_api burst=50 nodelay;
            proxy_pass http://trustvault;
        }

        # TrustVault static assets
        location /trustvault_api/_next/static/ {
            proxy_pass http://trustvault;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # =====================================================================
        # MARKETPLACE ROUTES (/marketplace)
        # =====================================================================
        # Marketplace API routes
        location /marketplace-app/ {
            limit_req zone=marketplace_api burst=20 nodelay;
            proxy_pass http://marketplace;
        }

        # Marketplace static assets
        location /marketplace/_next/static/ {
            proxy_pass http://marketplace;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Marketplace WebSocket (HMR in development)
        location /marketplace/_next/webpack-hmr {
            proxy_pass http://marketplace;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Marketplace main routes
        location /marketplace {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://marketplace;
        }

        # =====================================================================
        # SIGNET MAIN APPLICATION ROUTES (/)
        # =====================================================================
        # Signet API routes
        location /api/ {
            limit_req zone=signet_api burst=20 nodelay;
            proxy_pass http://signet;
        }

        # Signet static assets
        location /_next/static/ {
            proxy_pass http://signet;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Signet Next.js assets
        location /_next/ {
            proxy_pass http://signet;
        }

        # Signet WebSocket (HMR)
        location /_next/webpack-hmr {
            proxy_pass http://signet;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check
        location = /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Signet main application (catch-all for root paths)
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://signet;
        }

        # ---------------------------------------------------------------------
        # Error Pages
        # ---------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ---------------------------------------------------------------------
        # Deny access to hidden files
        # ---------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    # -------------------------------------------------------------------------
    # METRICS ADMIN PANEL - https://metrics.signetapp.xyz -> signet-metrics:3003
    # -------------------------------------------------------------------------
    # Its own certificate, issued by .github/workflows/issue-cert.yml (webroot, through the
    # port-80 server above). The certificate must exist before this block is deployed:
    # nginx refuses to start with a missing certificate file, which would take signetapp.xyz
    # down with it.
    #
    # The backend is resolved per request through Docker's DNS instead of an upstream block,
    # so nginx still starts when signet-metrics is not running (this site alone answers 502).
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name metrics.signetapp.xyz;

        ssl_certificate /etc/letsencrypt/live/metrics.signetapp.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/metrics.signetapp.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # An admin panel: never framed, never indexed, no referrer leaves it.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Optional second lock: only these addresses reach the panel at all. Uncomment and list
        # the admins' fixed IPs to enable.
        # allow 203.0.113.10;
        # deny all;

        limit_conn conn_limit 20;

        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $metrics_backend http://signet-metrics:3003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # Wallet sign-in: slow enough that nobody hammers it.
        location /api/auth/ {
            limit_req zone=metrics_auth burst=10 nodelay;
            proxy_pass $metrics_backend;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass $metrics_backend;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
