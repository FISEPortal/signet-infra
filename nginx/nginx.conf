# =============================================================================
# Signet Infrastructure - Unified Nginx Reverse Proxy Configuration
# =============================================================================
# Routes traffic to all Signet ecosystem applications:
#   /            -> signet-app:3000       (Main Signet application)
#   /marketplace -> marketplace-app:3001  (DApp Marketplace)
#   /storage     -> trustVault-api:3002  (Marketplace storage/assets)
#
# Features:
#   - SSL/TLS termination (TLS 1.2/1.3)
#   - HTTP to HTTPS redirect
#   - WebSocket support
#   - Gzip compression
#   - Rate limiting per service
#   - Security headers
#   - Static asset caching
#   - Let's Encrypt ACME support
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Logging format with timing information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance Settings
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=signet_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=marketplace_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=trustvault_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limit status code
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # DNS Resolver for Dynamic Upstreams
    # -------------------------------------------------------------------------
    # Use Docker's internal DNS resolver with short cache TTL
    # This allows nginx to start even when upstream containers aren't running
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # HTTP Server - Redirect to HTTPS & ACME Challenge
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name signetapp.xyz www.signetapp.xyz;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Health check endpoint (no redirect)
        location = /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Server - Main Configuration
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name signetapp.xyz www.signetapp.xyz;

        # ---------------------------------------------------------------------
        # SSL Configuration
        # ---------------------------------------------------------------------
        ssl_certificate /etc/letsencrypt/live/signetapp.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/signetapp.xyz/privkey.pem;

        # Modern TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # OCSP Stapling (disabled - cert doesn't have OCSP responder URL)
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 8.8.8.8 8.8.4.4 valid=300s;
        # resolver_timeout 5s;

        # ---------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Connection limits
        limit_conn conn_limit 20;

        # ---------------------------------------------------------------------
        # Proxy Defaults
        # ---------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # =====================================================================
        # SIGNET API ROUTES (/api/auth, /api/dapp, /api/engine)
        # =====================================================================
        # These must come BEFORE the trustvault /api/ catch-all
        location /api/auth/ {
            limit_req zone=signet_api burst=20 nodelay;
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        location /api/dapp/ {
            limit_req zone=signet_api burst=20 nodelay;
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        location /api/engine/ {
            limit_req zone=signet_api burst=20 nodelay;
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        # =====================================================================
        # TRUSTVAULT API ROUTES (/api) - catch-all for remaining /api routes
        # =====================================================================
        location /api/ {
            limit_req zone=trustvault_api burst=20 nodelay;
            set $trustvault_upstream http://trustvault-api:3002;
            proxy_pass $trustvault_upstream;
        }

        # TrustVault static assets
        location /trustvault_api/_next/static/ {
            set $trustvault_upstream http://trustvault-api:3002;
            proxy_pass $trustvault_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # =====================================================================
        # MARKETPLACE ROUTES (/marketplace, /storage)
        # =====================================================================
        # Marketplace API routes
        location /marketplace-app/ {
            limit_req zone=marketplace_api burst=20 nodelay;
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
        }

        # Marketplace static assets
        location /marketplace/_next/static/ {
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Marketplace WebSocket (HMR in development)
        location /marketplace/_next/webpack-hmr {
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Marketplace main routes
        location /marketplace {
            limit_req zone=general burst=50 nodelay;
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
        }

        # Storage routes (served by trustvault-api)
        location /storage {
            limit_req zone=general burst=50 nodelay;
            
            # Allow larger file uploads (100MB max)
            client_max_body_size 100M;
            
            set $marketplace_upstream http://trustvault-api:3002;
            proxy_pass $marketplace_upstream;
        }

        # =====================================================================
        # SIGNET MAIN APPLICATION ROUTES (/)
        # =====================================================================
        # Signet static assets
        location /_next/static/ {
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Signet Next.js assets
        location /_next/ {
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        # Signet WebSocket (HMR)
        location /_next/webpack-hmr {
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check
        location = /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Signet main application (catch-all for root paths)
        location / {
            limit_req zone=general burst=50 nodelay;
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        # ---------------------------------------------------------------------
        # Error Pages
        # ---------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ---------------------------------------------------------------------
        # Deny access to hidden files
        # ---------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}

