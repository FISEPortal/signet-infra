# =============================================================================
# Signet Infrastructure - LOCAL DEVELOPMENT Nginx Configuration
# =============================================================================
# HTTP-only config for local development. No SSL certificates required.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=signet_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=marketplace_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=trustvault_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # HTTP Server (Development)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Health check
        location = /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Proxy defaults
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # TrustVault API
        location /storage/ {
            limit_req zone=trustvault_api burst=50 nodelay;
            set $trustvault_upstream http://trustVault-api:3002;
            proxy_pass $trustvault_upstream;
        }

        location /trustvault_api/_next/static/ {
            set $trustvault_upstream http://trustvault-api:3002;
            proxy_pass $trustvault_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Marketplace
        location /marketplace-app/ {
            limit_req zone=marketplace_api burst=20 nodelay;
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
        }

        location /marketplace/_next/static/ {
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /marketplace/_next/webpack-hmr {
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /marketplace {
            limit_req zone=general burst=50 nodelay;
            set $marketplace_upstream http://marketplace-app:3001;
            proxy_pass $marketplace_upstream;
        }

        # Signet main app
        location ~ ^/(api(?!/)) {
            limit_req zone=signet_api burst=20 nodelay;
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        location /_next/static/ {
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /_next/ {
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        location /_next/webpack-hmr {
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            set $signet_upstream http://signet-app:3000;
            proxy_pass $signet_upstream;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
