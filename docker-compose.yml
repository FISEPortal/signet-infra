# =============================================================================
# Signet Infrastructure - Shared Nginx Reverse Proxy
# =============================================================================
# This compose file creates a shared nginx reverse proxy and Docker network
# that all Signet ecosystem applications connect to.
#
# Usage:
#   Start:    docker compose up -d
#   Stop:     docker compose down
#   Logs:     docker compose logs -f nginx
#   Reload:   docker compose exec nginx nginx -s reload
#
# Note: This must be started BEFORE any application containers.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  # Routes traffic to all Signet ecosystem applications:
  #   /            -> signet-app:3000
  #   /marketplace -> marketplace-app:3001
  #   /storage     -> trustvault-api:3002
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: signet-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - signet-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# =============================================================================
# Shared Network
# =============================================================================
# All Signet ecosystem applications must join this external network.
# Each app's docker-compose.yml should reference:
#
#   networks:
#     signet-network:
#       external: true
# =============================================================================
networks:
  signet-network:
    name: signet-network
    driver: bridge

